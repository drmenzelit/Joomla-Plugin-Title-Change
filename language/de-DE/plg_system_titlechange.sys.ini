PLG_SYSTEM_TITLECHANGE="System - Titel mit HTML/CSS ändern"
PLG_SYSTEM_TITLECHANGE_XML_DESCRIPTION="Das Plugin erlaubt HTML Tags im Titel (Artikel, Menü, Modul) einzufügen. <br />Schreibe deinen Text innerhalb von {titlechange:deineCssKlasse und } um eine span class im Titel einzufügen.<br />Beispiele:<br />Dieser Text soll {titlechange:sup hochgestellt} und wieder normal sein.<br />ERGEBNISS<br />
Dieser Text soll < span class='sup' >hochgestellt< /span >  und wieder normal sein.<br /><br />Mit einer CSS Klasse .sup {vertical-align: super; font-size: smaller;} erscheint der Text hochgestellt. <br />Dieser Text soll {titlechange:sup hochgestellt} und wieder normal sein.<br /><br />Dieser Text soll {titlechange:red in roter Farbe erscheinen} und wieder normal.<br />ERGEBNISS<br />Dieser Text soll < span class='red' >in roter Farbe erscheinen< /span > und wieder normal.<br /><br />Mit einer CSS Klasse .red {color: #ff0000;} wird der Text rot. <br />
Dieser Text soll <span style='color:red;'>in roter Farbe erscheinen</span> und wieder normal.<br />"
